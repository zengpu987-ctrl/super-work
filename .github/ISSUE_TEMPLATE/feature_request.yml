name: Feature request / 功能建议
description: 希望新增的能力
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 谁在什么场景遇到什么困难
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案 / Proposal
      description: 期望的交互、边界、替代方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响面
      options:
        - 编排 / 模式
        - Provider / 模型接入
        - Chat / 多轮
        - 产物 / 文件
        - 上下文 / 记忆 / 预算
        - UI / 3D
        - 插件 / 工作流
        - 文档 / 社区
        - 其他
  - type: checkboxes
    id: contribution
    attributes:
      label: 你愿意参与实现吗？
      options:
        - label: 我可以提交 PR
        - label: 我可以提供测试/评测
        - label: 我可以帮忙翻译/文档
